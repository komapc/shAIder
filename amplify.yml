version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - export CDK_DISABLE_VERSION_CHECK=true
        - export CDK_BOOTSTRAP_QUALIFIER=shaid
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node ^20.19 || >=22.12; don't rely on the build image default.
        - nvm install 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
